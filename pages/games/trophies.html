  <style>
    .pg-page {
      max-width: 1400px;
      margin: 0 auto;
      padding: 32px 34px 64px
    }

    .pg-header {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 24px
    }

    .pg-header h1 {
      margin: 0;
      font-size: 32px;
      letter-spacing: -.03em
    }

    .pg-header p {
      margin: 8px 0 0;
      color: var(--text-muted)
    }

    .pg-grid {
      display: grid;
      grid-template-columns: repeat(12, minmax(0, 1fr));
      gap: 18px
    }

    .pg-card {
      background: var(--surface, #fff);
      border: 1px solid var(--border, #e2e8e5);
      border-radius: 18px;
      padding: 22px;
      box-shadow: 0 8px 28px rgba(15, 23, 42, .05);
      min-width: 0
    }

    .pg-card h2,
    .pg-card h3 {
      margin: 0 0 8px
    }

    .pg-muted {
      color: var(--text-muted)
    }

    .pg-stat {
      font-size: 30px;
      font-weight: 800;
      margin-top: 8px
    }

    .pg-table {
      width: 100%;
      border-collapse: collapse
    }

    .pg-table th,
    .pg-table td {
      text-align: left;
      padding: 14px 10px;
      border-bottom: 1px solid var(--border, #e2e8e5);
      vertical-align: middle
    }

    .pg-table th {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: .08em;
      color: var(--text-muted)
    }

    .pg-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 10px;
      border-radius: 999px;
      background: color-mix(in srgb, var(--brand-primary, #16a66f) 10%, white);
      color: var(--brand-primary, #16a66f);
      font-weight: 700;
      font-size: 12px
    }

    .pg-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap
    }

    .pg-list {
      display: grid;
      gap: 10px
    }

    .pg-list-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 14px 0;
      border-bottom: 1px solid var(--border, #e2e8e5)
    }

    .pg-list-row:last-child {
      border-bottom: 0
    }

    .pg-empty {
      text-align: center;
      padding: 56px 20px
    }

    .pg-empty .empty-icon {
      font-size: 34px;
      margin-bottom: 10px
    }

    @media(max-width:900px) {
      .pg-page {
        padding: 24px 18px 48px
      }

      .pg-header {
        align-items: flex-start;
        flex-direction: column
      }

      .pg-grid {
        grid-template-columns: 1fr 1fr
      }
    }

    @media(max-width:620px) {
      .pg-page {
        padding: 18px 14px 36px
      }

      .pg-grid {
        grid-template-columns: 1fr
      }

      .pg-header h1 {
        font-size: 27px
      }

      .pg-table {
        display: block;
        overflow-x: auto;
        white-space: nowrap
      }

      .pg-card {
        padding: 18px
      }

      .pg-list-row {
        align-items: flex-start;
        flex-direction: column
      }
    }
  </style>

        <div class="pg-list" id="trophy-page-list"></div>

      <aside class="pg-card" style="grid-column:span 4">

        <p class="pg-muted">Overall vault completion</p>
        <div class="progress-track">
