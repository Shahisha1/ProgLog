<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Sign in | progLog</title>
    <meta name="description" content="Create a progLog account or sign in to save your gaming progress.">
    <meta name="theme-color" content="#3d173e">
    <link rel="icon" href="../assets/images/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="../assets/css/styles.css">
</head>

<body>
    <main class="auth-page">
        <div class="auth-box"><a class="brand auth-brand" href="../index.html"><span class="brand-mark"><i
                        data-lucide="gamepad-2"></i></span>prog<span>Log</span></a>
            <section class="auth-card">
                <h1 id="authHeading">Welcome back</h1>
                <p class="lede">Save your games, sessions, achievements, friends and profile.</p>
                <form id="authForm" class="form">
                    <div class="field"><label for="authEmail">Email</label><input id="authEmail" type="email"
                            autocomplete="email" required></div>
                    <div class="field"><label for="authPassword">Password</label><input id="authPassword"
                            type="password" autocomplete="current-password" minlength="6" required></div>
                    <div class="field hidden" id="passwordConfirmField"><label for="authPasswordConfirm">Confirm
                            password</label><input id="authPasswordConfirm" type="password" autocomplete="new-password">
                    </div><button id="authSubmit" class="btn btn-primary" type="submit">Sign in</button><button
                        id="googleAuth" class="btn" type="button"><i data-lucide="chrome"></i> Continue with
                        Google</button><button id="demoAuth" class="btn demo-auth" type="button"><i
                            data-lucide="play-circle"></i> Enter demo profile</button><button id="resetPassword"
                        class="btn btn-ghost" type="button">Reset password</button><a id="authSwitch" class="link"
                        href="#">New to progLog? Create an account</a>
                </form>
                <div id="flash" class="notice hidden" role="status"></div>
            </section>
        </div>
    </main>
    <script type="module" src="../assets/js/app.js"></script>
</body>

</html>
